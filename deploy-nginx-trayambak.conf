# Trayambak Agent API — reverse proxy (Cloudflare -> this box -> loopback).
# Agent turns stream over SSE for many minutes: buffering off, timeouts long.
# certbot manages the 443 block (see below); this file owns port 80 + proxying.

upstream trayambak {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name skt.sktailabs.in;

    # ACME + health stay public; everything else also proxies (auth lives
    # in the app: bearer token on all routes except /health).
    location / {
        proxy_pass http://trayambak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE/agent turns: never buffer, never cut long streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
    }
}

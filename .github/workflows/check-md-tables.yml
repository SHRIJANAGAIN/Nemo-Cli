name: check-md-tables

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/check-md-tables.yml"
  push:
    branches: [main, master]
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Markdown tables + prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prettier check on markdown
        run: npx prettier --check "**/*.md"
      - name: Table pipe padding (compact tables)
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('git diff --name-only origin/main...HEAD -- \"*.md\" 2>/dev/null || git ls-files \"*.md\"', { encoding: 'utf8' }).split('\n').filter(Boolean);
            let bad = 0;
            for (const f of files) {
              let text; try { text = fs.readFileSync(f, 'utf8'); } catch { continue; }
              const lines = text.split('\n');
              for (let i = 0; i < lines.length; i++) {
                const l = lines[i];
                if (/^\s*\|.*\|\s*$/.test(l) && l.includes('  |')) {
                  console.error(f + ':' + (i + 1) + ': double-space before pipe: ' + l.slice(0, 120));
                  bad++;
                }
              }
            }
            if (bad > 0) { console.error(bad + ' table padding issue(s) — run npx prettier --write'); process.exit(1); }
            console.log('tables ok in ' + files.length + ' files');
          "

name: process-management
on: [push, pull_request]
jobs:
  process-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --filter=core --coverage
      - name: Assert ProcessManager exists
        run: |
          grep -q "class ProcessManager" packages/core/src/process.ts
          grep -q "killProcessGroup" packages/core/src/process.ts
          grep -q "spawnProcess" packages/core/src/process.ts
          echo "ProcessManager with group-kill capability ✓"

  exec-expiration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm test -- --filter=core --coverage
      - name: Assert exec expiration exists
        run: |
          grep -q "ExecExpiration" packages/core/src/process.ts
          grep -q "IO_DRAIN_TIMEOUT" packages/core/src/process.ts
          echo "Exec expiration with IO drain timeout ✓"

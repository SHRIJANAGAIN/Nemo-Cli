name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/apps/cli/src/index.js --version
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const v = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME;
            if ('v' + v !== tag) {
              console.error('::error::tag ' + tag + ' != package.json version v' + v);
              process.exit(1);
            }
            console.log('tag/version match: ' + tag);
          "
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/
            sbom.cyclonedx.json
          retention-days: 30

  publish-npm:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          node -e "
            const v = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME;
            if ('v' + v !== tag) {
              console.error('::error::tag ' + tag + ' != package.json version v' + v);
              process.exit(1);
            }
          "
      - run: npm run publish:build
      - name: Verify tarball contents before publishing
        run: npm run verify:pack
      - run: npm publish ./publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release (changelog notes)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "console.log(require('./package.json').version)" > VERSION
          gh release create "$GITHUB_REF_NAME" --title "Trayambak v$(cat VERSION)" --generate-notes \
            || gh release create "$GITHUB_REF_NAME" --title "Trayambak v$(cat VERSION)" --notes "See CHANGELOG.md"

name: docs-build

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "*.md"
      - "config.schema.json"
      - "package.json"
      - ".github/workflows/docs-build.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "config.schema.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Validate docs bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Internal links + anchors resolve
        run: npm run check:links
      - name: Markdown formatting clean
        run: npx prettier --check "docs/**/*.md" "README.md" "AGENTS.md"
      - name: Config schema valid + docs index present
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config.schema.json','utf8')); console.log('schema ok')"
          test -f docs/README.md || { echo "::error::docs/README.md missing"; exit 1; }
      - name: README version matches package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            if (!readme.includes(pkg.version)) { console.error('::warning::README.md does not mention version ' + pkg.version); }
            else { console.log('readme version ok: ' + pkg.version); }
          "

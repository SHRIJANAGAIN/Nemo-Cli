name: test-sharded

on:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: unit (${{ matrix.shard }}/${{ matrix.total }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20]
        total: [2]
        shard: [1, 2]
        include:
          - os: windows-latest
            node: 20
            total: 2
            shard: 1
          - os: macos-latest
            node: 20
            total: 2
            shard: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Sharded vitest (junit)
        run: npx vitest run --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=junit --outputFile=junit-${{ matrix.os }}-${{ matrix.shard }}.xml --reporter=basic
      - name: Publish unit report
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        with:
          report_paths: "junit-*.xml"
          annotate_only: true
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false
      - name: Upload unit artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: junit-*.xml

  required:
    name: test-sharded
    runs-on: ubuntu-latest
    needs: [unit]
    if: always()
    steps:
      - run: test "${{ needs.unit.result }}" = "success"

name: session-store
on: [push, pull_request]
jobs:
  session-store-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # vitest has no --filter flag (it would throw CACError: Unknown option).
      # `-t` is the testNamePattern regex, so one focused run covers all three
      # describes: AnalyticsManager, ThreadStore, EnvFilter.
      - run: npm test -- packages/core/src/modules.test.ts -t "AnalyticsManager|ThreadStore|EnvFilter"

name: session-store
on: [push, pull_request]

permissions:
  contents: read
jobs:
  session-store-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # vitest has no --filter flag (it would throw CACError: Unknown option).
      # `-t` is the testNamePattern regex, so one focused run covers all three
      # describes: AnalyticsManager, ThreadStore, EnvFilter.
      - run: npm test -- packages/core/src/modules.test.ts -t "AnalyticsManager|ThreadStore|EnvFilter"

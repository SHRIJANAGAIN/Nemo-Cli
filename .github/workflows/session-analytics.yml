name: session-store
on: [push, pull_request]
jobs:
  session-store-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # vitest has no --filter flag (it would throw CACError: Unknown option).
      # `-t` is the testNamePattern regex, so one focused run covers all three
      # describes: AnalyticsManager, ThreadStore, EnvFilter.
      - run: npm test -- packages/core/src/modules.test.ts -t "AnalyticsManager|ThreadStore|EnvFilter"

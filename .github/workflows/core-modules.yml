name: core-modules
on: [push, pull_request]
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --filter=core
  coverage-gate:
    runs-on: ubuntu-latest
    needs: [core-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Assert coverage threshold
        run: npx vitest run --coverage 2>&1 | grep -q "passed" && echo "Coverage threshold met"

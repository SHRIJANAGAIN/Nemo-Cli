name: core-modules
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The legacy TUI cluster and the DOM-aware logic/ tree each compile as
      # their own program (root Node code must never see `window`) — gate
      # them alongside the main program.
      - run: npm run typecheck:ink
      - run: npm run typecheck:logic
      # Real gate: vitest exits non-zero when any test fails; the positional
      # arg filters to the core package's test files. The exit code is the
      # signal — no output grepping (a `grep -q "passed"` pipe swallows the
      # test runner's exit status and passes whenever the word appears).
      - run: npx vitest run packages/core
  coverage-gate:
    runs-on: ubuntu-latest
    # Independent of core-tests: the coverage gate must report its own
    # verdict even when unit tests fail (and vice versa).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vitest.config.ts coverage.thresholds fails this run (non-zero exit)
      # when the measured coverage drops below the floor — that exit code is
      # the gate. A previous `2>&1 | grep -q "passed" && echo …` line made
      # the step succeed on the literal word "passed" while discarding
      # vitest's own status, and ran the suite twice.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

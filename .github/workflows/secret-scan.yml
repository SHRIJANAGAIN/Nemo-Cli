name: secret-scan
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Secrets hide in history, not just the tip — scan every commit.
          fetch-depth: 0
      - name: Gitleaks (full history, repo config .gitleaks.toml)
        # Free for personal/FOSS repositories (a GITLEAKS_LICENSE env is
        # only required for organisation-owned repos).
        # SHA-pinned instead of the moving `v2` major tag: resolved via
        # the GitHub API as refs/tags/v2 -> annotated tag dcedce43 ->
        # commit ff98106e (2025-04-17, "bump cache", GitHub-verified), so
        # a tag move can never silently change what runs with our token.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

name: secret-scan
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secrets hide in history, not just the tip — scan every commit.
          fetch-depth: 0
      - name: Gitleaks (full history, repo config .gitleaks.toml)
        # Free for personal/FOSS repositories (a GITLEAKS_LICENSE env is
        # only required for organisation-owned repos).
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

name: check-generated

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generated:
    name: Generated artifacts in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Version single-sourced (package.json -> apps/cli/src/version.ts)
        run: |
          npm run sync-version
          git diff --exit-code -- apps/cli/src/version.ts \
            || { echo "::error::apps/cli/src/version.ts out of sync — run npm run sync-version"; exit 1; }
      - name: Config schema valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('config.schema.json','utf8')); console.log('schema ok')"
      - name: SBOM generates cleanly
        run: npm run sbom
      - name: Publish tree verifies (no tests/journals/maps)
        run: |
          npm run publish:build:debug
          npm run verify:pack
        env:
          TRAYAMBAK_SKIP_OBFUSCATION: "1"
      - name: No stale dist/ committed
        run: |
          if git ls-files dist | grep -q .; then
            echo "::error::dist/ files are tracked — dist must stay untracked (see .gitignore)"
            git ls-files dist
            exit 1
          fi
          echo "dist untracked ok"

name: containers

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "deploy-nginx-trayambak.conf"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/containers.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase repository owner
        id: repo
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (no push on PR/dispatch dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.repo.outputs.owner_lc }}/trayambak:latest,ghcr.io/${{ steps.repo.outputs.owner_lc }}/trayambak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: publish-gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cli:
    name: Validate CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CLI --version + --help in clean HOME
        shell: bash
        run: |
          ROOT="$(mktemp -d)"
          export XDG_DATA_HOME="$ROOT/data" XDG_CACHE_HOME="$ROOT/cache" XDG_CONFIG_HOME="$ROOT/config" XDG_STATE_HOME="$ROOT/state"
          node dist/apps/cli/src/index.js --version
          node dist/apps/cli/src/index.js --help | head -n 20
          rm -rf "$ROOT"
      - name: E2E gate (version/modes/sandbox/execpolicy)
        run: npm run test:e2e

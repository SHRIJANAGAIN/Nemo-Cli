name: typecheck

on:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect typecheck changes
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ts:
              - '**/*.ts'
              - '**/*.tsx'
              - 'tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'

  logic:
    name: typecheck-logic
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:logic

  ink:
    name: typecheck-ink
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:ink

  required:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [changes, logic, ink]
    if: always()
    steps:
      - name: Verify typecheck jobs passed
        run: |
          echo "changed=${{ needs.changes.outputs.ts }}"
          echo "logic=${{ needs.logic.result }}"
          echo "ink=${{ needs.ink.result }}"
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.ts }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ needs.logic.result }}" = "success"
            test "${{ needs.ink.result }}" = "success"
          fi

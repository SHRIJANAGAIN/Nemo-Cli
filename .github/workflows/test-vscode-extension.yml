name: test-vscode-extension

on:
  push:
    branches: [main, master]
    paths:
      - "apps/vscode-extension/**"
      - ".github/workflows/test-vscode-extension.yml"
  pull_request:
    paths:
      - "apps/vscode-extension/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Extension unit (tsc + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Extension compiles under repo tsconfig
        run: npm run typecheck
      - name: Extension lint clean
        run: npx eslint apps/vscode-extension
      - name: Extension formatting clean
        run: npx prettier --check "apps/vscode-extension/**/*.{ts,json,md}"

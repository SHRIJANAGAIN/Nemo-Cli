<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Nemo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">Nemo</span>
      <button id="folder" type="button" title="Choose a workspace folder">Open folder</button>
      <span id="workspace" class="workspace" title="Active workspace">—</span>
      <span id="status" class="status" data-state="ready">ready</span>
    </header>

    <main id="log" class="log" aria-live="polite" aria-label="Conversation"></main>

    <footer class="composer">
      <textarea
        id="input"
        rows="3"
        placeholder="Ask Nemo… — Enter sends, Shift+Enter adds a newline"
        spellcheck="false"
      ></textarea>
      <div class="actions">
        <button id="stop" type="button" disabled>Stop</button>
        <button id="send" type="button">Send</button>
      </div>
    </footer>

    <script src="markdown.js"></script>
    <script src="app.js"></script>
  </body>
</html>
